name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runner: the NEON fast paths.
          - { os: macos-14, scalar: "OFF", name: macos-neon }
          # Same hardware, scalar fallbacks forced on: catches bit-rot in
          # the #else branches that dev machines never compile.
          - { os: macos-14, scalar: "ON", name: macos-scalar }
          # x86 Linux: scalar by default, plus a second toolchain/platform.
          - { os: ubuntu-latest, scalar: "OFF", name: linux-scalar }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: python -m pip install numpy pybind11 pytest
      - name: Configure
        run: >
          cmake -S . -B build
          -DPython3_EXECUTABLE=$(which python)
          -DPROXIMA_FORCE_SCALAR=${{ matrix.scalar }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: python -m pytest tests/ -v

  asan:
    name: asan-${{ matrix.scalar == 'ON' && 'scalar' || 'neon' }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scalar: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pybind11 is only needed for the unconditional find_package; the ASan
      # config builds the standalone harness, not the module.
      - name: Install pybind11
        run: python -m pip install pybind11
      - name: Configure (ASan)
        run: >
          cmake -S . -B build-asan
          -DPython3_EXECUTABLE=$(which python)
          -DPROXIMA_ASAN=ON
          -DPROXIMA_FORCE_SCALAR=${{ matrix.scalar }}
      - name: Build harness
        run: cmake --build build-asan -j
      - name: Run under AddressSanitizer
        run: ASAN_OPTIONS=detect_leaks=0 ./build-asan/asan_smoke
